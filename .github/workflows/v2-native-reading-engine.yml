name: V2 Native Speech Engine — Isolated Contract Gate

on:
  push:
    branches:
      - feature/v2-native-speech-engine-rebuild-20261102
    paths:
      - 'services/api/v2_reading_engine/**'
      - 'services/api/test_v2_native_reading_engine.py'
      - 'services/api/test_v2_native_azure_provider.py'
      - 'services/api/test_v2_reading_job_store.py'
      - 'services/api/test_v2_assessment_fractional_scores.py'
      - 'services/api/test_v2_academic_apply.py'
      - 'services/api/v2_assessment_runtime.py'
      - 'services/api/test_v2_native_reading_worker.py'
      - 'services/api/db/v2_reading_models.py'
      - 'services/api/db/learning_models.py'
      - 'services/api/alembic/versions/0032_v2_native_reading.py'
      - '.github/workflows/v2-native-reading-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-engine-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 httpx==0.28.1 sqlalchemy==2.0.44
      - name: Verify owner alias, vowel, scoring, retry, and safe student contracts
        working-directory: services/api
        # Contract tests intentionally do not load the application's DB/storage conftest.
        run: python -m pytest --noconftest -q test_v2_native_reading_engine.py test_v2_native_azure_provider.py test_v2_reading_job_store.py test_v2_native_reading_worker.py test_v2_assessment_fractional_scores.py test_v2_academic_apply.py
