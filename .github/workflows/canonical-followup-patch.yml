name: Himma Canonical Follow-up Patch

on:
  push:
    branches:
      - integration/canonical-content-2026-09-08
    paths:
      - .github/workflows/canonical-followup-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/canonical-content-2026-09-08
      - name: Align media semantics and immutable audio regression
        run: |
          python - <<'PY'
          from pathlib import Path

          contract = Path("services/api/content_approval_contract_2026_09_08.py")
          text = contract.read_text(encoding="utf-8")
          old = '    "L2-REIN-04":{1:[("VOC-03","image","choice","باب"),("VOC-04","image","choice","قلم"),("VOC-06","image","choice","شمس")],2:[("VOC-04","image","choice","قلم"),("VOC-06","image","choice","شمس"),("VOC-16","image","choice","قطة")],3:[("VOC-06","image","choice","شمس"),("VOC-16","image","choice","قطة"),("VOC-02","image","choice","كتاب")],4:[("VOC-16","image","choice","قطة"),("VOC-02","image","choice","كتاب"),("VOC-03","image","choice","باب")],5:[("VOC-02","image","choice","كتاب"),("VOC-03","image","choice","باب"),("VOC-04","image","choice","قلم")]},'
          new = '    "L2-REIN-04":{1:[("VOC-03","image","choice","بَاب"),("VOC-04","image","choice","قَلَم"),("VOC-06","image","choice","شَمْس")],2:[("VOC-04","image","choice","قَلَم"),("VOC-06","image","choice","شَمْس"),("VOC-16","image","choice","قِطَّة")],3:[("VOC-06","image","choice","شَمْس"),("VOC-16","image","choice","قِطَّة"),("VOC-02","image","choice","كِتَاب")],4:[("VOC-16","image","choice","قِطَّة"),("VOC-02","image","choice","كِتَاب"),("VOC-03","image","choice","بَاب")],5:[("VOC-02","image","choice","كِتَاب"),("VOC-03","image","choice","بَاب"),("VOC-04","image","choice","قَلَم")]},'
          if old not in text:
              raise SystemExit("L2-REIN-04 media anchor not found")
          contract.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("services/api/test_adaptation_runtime.py")
          test = test_path.read_text(encoding="utf-8")
          old_test = '''        # Only the graded latest submission becomes academic evidence.\n        submission.status = "graded"\n        response.is_correct = True\n        db.commit()\n        graded = prepare_next_for_student(db, student, session)\n'''
          new_test = '''        # Immutable rejected history remains, but the newest graded rerecord is\n        # the only review state allowed to become academic evidence.\n        submission.status = "rerecord_required"\n        db.add(AudioSubmission(\n            response_id=response.id,\n            storage_key="test/rerecorded-graded.webm",\n            file_size=110,\n            mime_type="audio/webm",\n            duration_seconds=2,\n            status="graded",\n        ))\n        response.is_correct = True\n        db.commit()\n        graded = prepare_next_for_student(db, student, session)\n'''
          if old_test not in test:
              raise SystemExit("audio regression anchor not found")
          test_path.write_text(test.replace(old_test, new_test, 1), encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/content_approval_contract_2026_09_08.py services/api/test_adaptation_runtime.py
          git diff --cached --check
          git commit -m "fix(content): align vocalized image semantics"
          git push origin HEAD:integration/canonical-content-2026-09-08
