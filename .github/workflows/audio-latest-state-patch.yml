name: Himma Audio Latest-State Patch

on:
  push:
    branches:
      - integration/canonical-content-2026-09-08
    paths:
      - .github/workflows/audio-latest-state-patch.yml

permissions:
  contents: write

jobs:
  patch-audio-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/canonical-content-2026-09-08
      - name: Make adaptation use latest immutable audio submission
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("services/api/adaptation.py")
          text = path.read_text(encoding="utf-8")

          old_import = "from db.adaptation_models import AdaptationDecision, RewardEvent\n"
          new_import = "from audio_review_state import latest_audio_submission, session_audio_review_summary\nfrom db.adaptation_models import AdaptationDecision, RewardEvent\n"
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit("adaptation import anchor not found")
              text = text.replace(old_import, new_import, 1)

          old_query = "        audio = db.query(AudioSubmission).filter(AudioSubmission.response_id == response.id).first()\n"
          new_query = "        audio = latest_audio_submission(db, response)\n"
          if old_query in text:
              text = text.replace(old_query, new_query, 1)
          elif new_query not in text:
              raise SystemExit("attempt audio query anchor not found")

          old_manual = '''        pending_audio = (\n            db.query(AudioSubmission.id)\n            .join(AttemptResponse, AttemptResponse.id == AudioSubmission.response_id)\n            .join(Attempt, Attempt.id == AttemptResponse.attempt_id)\n            .filter(\n                Attempt.session_id == active_core.id,\n                AudioSubmission.status.in_(["pending", "uploaded", "rerecord_required"]),\n            )\n            .first()\n        )\n'''
          new_manual = "        pending_audio = session_audio_review_summary(db, active_core.id).has_unresolved\n"
          if old_manual in text:
              text = text.replace(old_manual, new_manual, 1)
          elif new_manual not in text:
              raise SystemExit("manual override audio query anchor not found")

          # AudioSubmission is no longer queried directly in this module.
          text = text.replace("    AudioSubmission,\n", "", 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/adaptation.py
          git diff --cached --check
          git commit -m "fix(audio): evaluate only latest review submission"
          git push origin HEAD:integration/canonical-content-2026-09-08
