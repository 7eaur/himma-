name: One-time Himma V2 user media import
on:
  push:
    branches:
      - 'v2/01-learning-foundation-20261007'
    paths:
      - '.github/workflows/_himma-media-import-once.yml'
permissions:
  contents: write
jobs:
  import-provided-media:
    if: contains(github.event.head_commit.message, 'chore(media-import): start one-time asset transfer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify user attachment
        env:
          SOURCE_URL: "https://d2ol7oe51mr4n9.cloudfront.net/user_3EhM5o0DL0QJIRvUXeEqSl5v43B/460cfe8f-2d82-4fa5-a890-0caf9e437b4e.zip"
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 100 "$SOURCE_URL" -o /tmp/himma_v2_delivery.zip
          echo '433a7b0cdc8e91d93689f989c94d785f7a684650cee6c1ae468076f12a52b127  /tmp/himma_v2_delivery.zip' | sha256sum --check
      - name: Extract only the approved 12 MP3 / 12 WAV and preview MP4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,csv,io
          repo=Path('.')
          ids=set('AUD-L1-L AUD-L1-SAD AUD-L1-TA AUD-L1-TAA AUD-L1-03-SA AUD-L1-03-NU AUD-L1-03-LI AUD-V2-SUP-DAD AUD-L1-03-MU AUD-L2-RA AUD-V2-POST-TI AUD-V2-POST-BUU'.split())
          with zipfile.ZipFile('/tmp/himma_v2_delivery.zip') as z:
              prefix='HIMMA_AUD_L1_L2/HIMMA_AUD_L1_L2/'
              manifest=z.read(prefix+'manifest.csv')
              rows=list(csv.DictReader(io.StringIO(manifest.decode('utf-8-sig'))))
              assert len(rows)==12 and {r['id'] for r in rows}==ids,'12 recordings required'
              for row in rows:
                  rid=row['id']
                  for ext,folder in [('mp3','web_mp3'),('wav','wav_master')]:
                      source=prefix+folder+'/'+rid+'.'+ext
                      payload=z.read(source)
                      assert len(payload)>1000,source
                      target=repo/'assets'/'audio'/'HIMMA_AUDIO_V2'/folder/(rid+'.'+ext)
                      assert not target.exists(),f'already exists: {target}'
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(payload)
              parent=repo/'assets'/'audio'/'HIMMA_AUDIO_V2'
              (parent/'manifest.csv').write_bytes(manifest)
              (parent/'QA_REPORT.md').write_bytes(z.read(prefix+'QA_REPORT.md'))
              video=z.read('HIMMA_AUD_L1_L2/gemini_generated_video_72256b30.mp4')
              assert len(video)>1000000
              v=repo/'assets'/'video'/'HIMMA_V2_DEMO'/'gemini_generated_video_72256b30.mp4'
              assert not v.exists()
              v.parent.mkdir(parents=True,exist_ok=True)
              v.write_bytes(video)
              print('media imported:',len(rows),'audio pairs, video bytes',len(video))
          PY
      - name: Commit media assets only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/HIMMA_AUDIO_V2 assets/video/HIMMA_V2_DEMO
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 27
          git commit -m "assets(himma-v2): import 12 missing sounds and one shared lesson demo"
          git push origin HEAD:'v2/01-learning-foundation-20261007'
