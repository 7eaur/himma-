name: Himma Dependency Lock Refresh

on:
  push:
    branches:
      - integration/canonical-content-2026-09-08
    paths:
      - .github/workflows/dependency-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/canonical-content-2026-09-08
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Upgrade vulnerable frontend dependency chain
        working-directory: apps/web
        run: |
          npm install next@16.3.4 eslint-config-next@16.3.4
          npm audit fix
          npm audit --audit-level=high
      - name: Commit refreshed package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lock is already current."
            exit 0
          fi
          git commit -m "fix(web): upgrade vulnerable frontend dependencies"
          git push origin HEAD:integration/canonical-content-2026-09-08
