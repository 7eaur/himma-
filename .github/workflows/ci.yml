name: Himma CI

on:
  push:
    branches: [main, 'stage/*']
  pull_request:
    branches: [main]

jobs:
  # ─── Backend tests ────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: himma_test
          POSTGRES_PASSWORD: himma_test_pass
          POSTGRES_DB: himma_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U himma_test -d himma_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Alembic migration (upgrade, downgrade, upgrade)
        env:
          DATABASE_URL: postgresql://himma_test:himma_test_pass@localhost:5432/himma_test_db
          API_SECRET_KEY: ci-test-secret
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://himma_test:himma_test_pass@localhost:5432/himma_test_db
          API_SECRET_KEY: ci-test-secret
        run: pytest test_api.py -v --tb=short

  # ─── Frontend lint + build + tests ────────────────────────────────
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Run frontend tests
        run: npm test

  # ─── Integration: full stack E2E ──────────────────────────────────
  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: himma_test
          POSTGRES_PASSWORD: himma_test_pass
          POSTGRES_DB: himma_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U himma_test -d himma_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps
        working-directory: services/api
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run E2E auth flow tests
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://himma_test:himma_test_pass@localhost:5432/himma_test_db
          API_SECRET_KEY: ci-test-secret
        run: |
          alembic upgrade head
          pytest test_api.py -v --tb=short

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Frontend deps
        working-directory: apps/web
        run: npm ci
        
      - name: Install Playwright Browsers
        working-directory: apps/web
        run: npx playwright install --with-deps
        
      - name: Run Playwright E2E
        working-directory: apps/web
        run: npx playwright test
