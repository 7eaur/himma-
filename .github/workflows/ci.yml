name: Himma CI — P02 Baseline

on:
  push:
    branches: [main, 'stage/*', 'recovery/*']
  pull_request:
    branches: [main]

jobs:
  # ─── Backend: migrations + tests on real PostgreSQL ───────────────────────
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: himma_test
          POSTGRES_PASSWORD: himma_test_pass
          POSTGRES_DB: himma_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U himma_test -d himma_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      minio:
        image: minio/minio:RELEASE.2024-01-01T00-00-00Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --entrypoint sh
          -e MINIO_ROOT_USER=minioadmin
          -e MINIO_ROOT_PASSWORD=minioadmin
          --health-cmd="curl -sf http://localhost:9000/minio/health/live || exit 1"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=5
          --name minio
    
    defaults:
      run:
        working-directory: services/api

    env:
      DATABASE_URL: postgresql://himma_test:himma_test_pass@localhost:5432/himma_test_db
      API_SECRET_KEY: ci-test-secret-32-chars-minimum!!
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: himma-audio-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Wait for MinIO and create bucket
        run: |
          pip install boto3
          python - <<'EOF'
          import boto3, time, sys
          from botocore.exceptions import ClientError, EndpointConnectionError
          s3 = boto3.client('s3', endpoint_url='http://localhost:9000',
                            aws_access_key_id='minioadmin',
                            aws_secret_access_key='minioadmin',
                            region_name='us-east-1')
          for i in range(30):
              try:
                  s3.list_buckets()
                  try:
                      s3.head_bucket(Bucket='himma-audio-test')
                  except ClientError:
                      s3.create_bucket(Bucket='himma-audio-test')
                  print("MinIO ready, bucket created")
                  sys.exit(0)
              except (EndpointConnectionError, Exception) as e:
                  print(f"Waiting for MinIO... ({i+1}/30)")
                  time.sleep(2)
          print("MinIO did not become available")
          sys.exit(1)
          EOF

      - name: Alembic migrations — upgrade, downgrade, upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Verify seed idempotency (run twice)
        run: |
          python seed.py
          python seed.py
          python -c "
          import os
          from sqlalchemy import create_engine, text
          e = create_engine(os.environ['DATABASE_URL'])
          with e.connect() as c:
              n = c.execute(text('SELECT COUNT(*) FROM content_items')).scalar()
              assert n > 0, f'Expected content_items > 0, got {n}'
              print(f'content_items count: {n} (idempotent seed OK)')
          "

      - name: Run backend tests
        run: pytest test_api.py -v --tb=short

  # ─── Frontend: type-check + lint + build ──────────────────────────────────
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

  # ─── Integration: full E2E with real services ─────────────────────────────
  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: himma_test
          POSTGRES_PASSWORD: himma_test_pass
          POSTGRES_DB: himma_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U himma_test -d himma_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -sf http://localhost:9000/minio/health/live || exit 1"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://himma_test:himma_test_pass@localhost:5432/himma_test_db
      API_SECRET_KEY: ci-test-secret-32-chars-minimum!!
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: himma-audio-test
      REDIS_URL: redis://localhost:6379/0
      NEXT_PUBLIC_API_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps
        working-directory: services/api
        run: pip install -r requirements.txt

      - name: Init MinIO bucket
        working-directory: services/api
        run: |
          pip install boto3
          python - <<'EOF'
          import boto3, time, sys
          from botocore.exceptions import ClientError, EndpointConnectionError
          s3 = boto3.client('s3', endpoint_url='http://localhost:9000',
                            aws_access_key_id='minioadmin',
                            aws_secret_access_key='minioadmin',
                            region_name='us-east-1')
          for i in range(30):
              try:
                  s3.list_buckets()
                  try:
                      s3.head_bucket(Bucket='himma-audio-test')
                  except ClientError:
                      s3.create_bucket(Bucket='himma-audio-test')
                  print("MinIO ready")
                  sys.exit(0)
              except Exception as e:
                  print(f"Waiting... ({i+1})")
                  time.sleep(2)
          sys.exit(1)
          EOF

      - name: Run migrations and seed
        working-directory: services/api
        run: |
          alembic upgrade head
          python seed.py

      - name: Start FastAPI in background
        working-directory: services/api
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for API..."
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health || (echo "API failed to start" && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend deps
        working-directory: apps/web
        run: npm ci

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build

      - name: Start Next.js in background
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          npm start &
          echo "Waiting for Next.js..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 && break
            sleep 2
          done
          curl -sf http://localhost:3000 || (echo "Next.js failed to start" && exit 1)

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: true
        run: npx playwright test tests/e2e/vertical-slice.spec.ts --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
