name: Himma V2 — Arabic Word Tiles Visual Snapshot

permissions:
  contents: read

on:
  push:
    branches: ['v2/*']
    paths:
      - '.github/workflows/v2-word-tiles-visual-snapshot.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      E2E_RESEARCHER_USERNAME: admin
      E2E_RESEARCHER_PASSWORD: visual-test-fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build exact V2 frontend under test
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Start isolated auth fixture for screenshot (no production accounts)
        run: |
          cat >/tmp/himma-visual-api.py <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import json

          class Fixture(BaseHTTPRequestHandler):
              def respond(self, code, payload, cookie=False):
                  body=json.dumps(payload, ensure_ascii=False).encode()
                  self.send_response(code)
                  self.send_header('Content-Type','application/json; charset=utf-8')
                  self.send_header('Content-Length',str(len(body)))
                  if cookie:
                      self.send_header('Set-Cookie','access_token=word-tiles-visual-fixture; Path=/; HttpOnly; SameSite=Lax')
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path == '/me':
                      return self.respond(200, {'id':1,'role':'student'})
                  return self.respond(404,{'detail':'not found in visual-only fixture'})

              def do_POST(self):
                  if self.path == '/auth/login':
                      return self.respond(200, {'role':'researcher'}, True)
                  if self.path == '/researcher/students':
                      return self.respond(201, {'id':1,'access_code':'123456'})
                  if self.path == '/auth/student-login':
                      return self.respond(200, {'role':'student'}, True)
                  return self.respond(404, {'detail':'not found in visual-only fixture'})

          ThreadingHTTPServer(('127.0.0.1',8000), Fixture).serve_forever()
          PY
          python3 /tmp/himma-visual-api.py > /tmp/himma-visual-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/me >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/me

      - name: Start real Next.js V2 page
        working-directory: apps/web
        run: |
          npm start >/tmp/himma-visual-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:3000 >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:3000 >/dev/null

      - name: Install browser and capture authentic UI
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/v2-assessment-visual-baseline.spec.ts --grep "captures the real mobile word-building component" --reporter=list

      - name: Upload screenshot for review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: himma-word-builder-mobile-screenshot
          path: apps/web/playwright-report/screenshots/p09-v2-assessment/word-build-connected-ball-mobile-390.png
          retention-days: 7
          if-no-files-found: warn

      - name: Diagnose screenshot failure if needed
        if: failure()
        run: |
          tail -40 /tmp/himma-visual-api.log || true
          tail -40 /tmp/himma-visual-web.log || true
