name: Himma Audit — Canonical Media Usage

permissions:
  contents: write

on:
  push:
    branches: ['audit/comprehensive-repository-review-2026-09-10']
    paths: ['.github/workflows/audit-canonical-media-usage.yml']

jobs:
  media-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/comprehensive-repository-review-2026-09-10
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        working-directory: services/api
        run: pip install -r requirements.txt
      - name: Build canonical release and image usage report
        shell: bash
        env:
          PYTHONPATH: services/api
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          from canonical_release import build_canonical_release

          root = Path('.')
          kit = json.loads((root/'assets/education/developer/asset-map.json').read_text(encoding='utf-8'))
          generated_seq = json.loads((root/'assets/education/developer/generated-sequence-map.json').read_text(encoding='utf-8'))
          generated_voc = json.loads((root/'assets/education/developer/generated-vocabulary-map.json').read_text(encoding='utf-8'))
          release = build_canonical_release()

          meta = {}
          for row in kit.get('assets', []):
              meta[str(row['id'])] = {
                  'label': str(row.get('label_ar') or ''),
                  'category': str(row.get('category') or ''),
                  'source': 'kit',
                  'file': str((row.get('files') or {}).get('webp_small') or (row.get('files') or {}).get('webp') or ''),
              }
          for source, payload in [('generated_sequence', generated_seq), ('generated_vocabulary', generated_voc)]:
              for row in payload.get('assets', []):
                  meta[str(row['id'])] = {
                      'label': str(row.get('label_ar') or ''),
                      'category': source,
                      'source': source,
                      'file': str((row.get('files') or {}).get('webp_small') or (row.get('files') or {}).get('webp') or ''),
                  }

          uses = defaultdict(list)
          semantics = defaultdict(Counter)
          usage_types = defaultdict(Counter)
          for item in release.get('items', []):
              cid = str(item['canonical_id'])
              for asset in item.get('item_assets', []) or []:
                  if asset.get('asset_type') != 'image':
                      continue
                  aid = str(asset.get('asset_id') or '')
                  sem = str(asset.get('semantic_text') or '')
                  uses[aid].append(f'{cid}/ITEM')
                  semantics[aid][sem] += 1
                  usage_types[aid][str(asset.get('usage') or 'item')] += 1
              for step in item.get('rounds', []) or []:
                  r = int(step.get('order_index') or 0)
                  for asset in step.get('media', []) or []:
                      if asset.get('asset_type') != 'image':
                          continue
                      aid = str(asset.get('asset_id') or '')
                      sem = str(asset.get('semantic_text') or '')
                      uses[aid].append(f'{cid}/R{r:02d}')
                      semantics[aid][sem] += 1
                      usage_types[aid][str(asset.get('usage') or 'round')] += 1

          known_ids = set(meta)
          used_ids = set(uses)
          unused_kit = sorted(aid for aid, row in meta.items() if row['source'] == 'kit' and aid not in used_ids)
          used_unknown = sorted(used_ids - known_ids)
          multi_semantic = sorted(
              aid for aid, values in semantics.items()
              if len([k for k in values if k.strip()]) > 1
          )

          category_counts = Counter(meta[aid]['category'] for aid in used_ids if aid in meta)
          report = root/'docs/maintenance/HIMMA_A06_CANONICAL_IMAGE_USAGE_2026-09-10_AR.md'
          out = [
              '# هِمّة — A06 Canonical Image Usage Audit',
              '',
              f'- Canonical release: `{release.get("release_version")}`',
              f'- Canonical items: **{len(release.get("items", []))}**',
              f'- Known image IDs (kit + generated): **{len(known_ids)}**',
              f'- Image IDs referenced by canonical release: **{len(used_ids)}**',
              f'- Original kit IDs not referenced by canonical release: **{len(unused_kit)}**',
              f'- Referenced image IDs absent from known maps: **{len(used_unknown)}**',
              f'- Image IDs used with more than one non-empty semantic label: **{len(multi_semantic)}**',
              '',
              '## 1. Usage by asset',
              '',
              '| asset | source/category | approved label | use count | runtime semantics | locations |',
              '|---|---|---|---:|---|---|',
          ]
          for aid in sorted(used_ids):
              row = meta.get(aid, {'source':'UNKNOWN','category':'UNKNOWN','label':'','file':''})
              sem = '; '.join(f'{k or "∅"} ×{v}' for k,v in semantics[aid].most_common())
              locs = '<br>'.join(f'`{v}`' for v in uses[aid])
              out.append(f'| `{aid}` | {row["source"]}/{row["category"]} | {row["label"] or "—"} | {len(uses[aid])} | {sem or "—"} | {locs} |')

          out += ['', '## 2. Original approved kit images currently unused by canonical content', '']
          if unused_kit:
              for aid in unused_kit:
                  row = meta[aid]
                  out.append(f'- `{aid}` — **{row["label"]}** — category `{row["category"]}` — `{row["file"]}`')
          else:
              out.append('- None')

          out += ['', '## 3. Multi-semantic reuse requiring manual review', '']
          if multi_semantic:
              for aid in multi_semantic:
                  row = meta.get(aid, {})
                  out.append(f'- `{aid}` / {row.get("label") or "unknown"}: ' + ', '.join(f'`{k}` ×{v}' for k,v in semantics[aid].most_common()))
          else:
              out.append('- None')

          out += ['', '## 4. Referenced IDs missing from image maps', '']
          if used_unknown:
              out.extend(f'- `{aid}`' for aid in used_unknown)
          else:
              out.append('- None')

          out += ['', '## 5. Category coverage', '']
          for category, count in sorted(category_counts.items()):
              out.append(f'- `{category}`: {count} distinct referenced IDs')

          out += [
              '',
              '## 6. Interpretation',
              '',
              '1. الصورة غير المستخدمة ليست مرشحًا تلقائيًا للاستبدال؛ يلزم تطابق دلالي دقيق مع السؤال/الخيار.',
              '2. تعدد semantic_text لنفس asset قد يكون alias صحيحًا (مثل التصريف أو الاختصار) أو misuse؛ يراجع يدويًا.',
              '3. هذا التقرير مبني على الـcanonical release النهائي، وليس على ملفات legacy seed.',
              '4. الأصول التي لا تظهر هنا قد تكون أصول واجهة/شخصيات وليست محتوى أكاديميًا؛ تفحص في جرد public منفصل.',
              '',
          ]
          report.write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit report and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-canonical-media-usage.yml
          git add docs/maintenance/HIMMA_A06_CANONICAL_IMAGE_USAGE_2026-09-10_AR.md
          git commit -m 'docs(audit): map canonical image usage and unused assets'
          git push origin HEAD:audit/comprehensive-repository-review-2026-09-10
