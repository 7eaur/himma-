name: Himma Canonical Contract Reconciliation

permissions:
  contents: write

on:
  push:
    branches: ['integration/canonical-content-2026-09-08']
    paths: ['.github/workflows/canonical-contract-reconciliation.yml']

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/canonical-content-2026-09-08
          fetch-depth: 1
      - name: Apply canonical source reconciliation
        run: python .github/maintenance/canonical_contract_reconciliation.py
      - name: Commit reconciled source and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/canonical-contract-reconciliation.yml
          rm .github/maintenance/canonical_contract_reconciliation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api .github/workflows/canonical-contract-reconciliation.yml .github/maintenance/canonical_contract_reconciliation.py
          git commit -m 'fix(content): reconcile canonical learner and media contracts'
          git push origin HEAD:integration/canonical-content-2026-09-08
