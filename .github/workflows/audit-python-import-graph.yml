name: Himma Audit — Python Import Graph

permissions:
  contents: write

on:
  push:
    branches: ['audit/comprehensive-repository-review-2026-09-10']
    paths: ['.github/workflows/audit-python-import-graph.yml']

jobs:
  graph:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/comprehensive-repository-review-2026-09-10
          fetch-depth: 1

      - name: Build AST import graph for legacy modules
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import re
          import subprocess
          from collections import defaultdict
          from pathlib import Path

          tracked = [Path(p) for p in subprocess.check_output(['git','ls-files'], text=True).splitlines()]
          py_files = [p for p in tracked if p.suffix == '.py']
          legacy_re = re.compile(r'(seed|repair|overlay|projection|recovery|legacy)', re.I)
          candidates = [p for p in py_files if p.as_posix().startswith('services/api/') and legacy_re.search(p.name)]

          def module_for(path: Path) -> str:
              p = path.with_suffix('').as_posix()
              if p.startswith('services/api/'):
                  return p[len('services/api/'):].replace('/', '.')
              return p.replace('/', '.')

          module_paths = {module_for(p): p for p in py_files}
          # Top-level service modules are commonly imported after services/api is placed on sys.path.
          for p in py_files:
              if p.parent.as_posix() == 'services/api':
                  module_paths[p.stem] = p

          direct: dict[Path, set[Path]] = defaultdict(set)
          imports_by_file: dict[Path, set[str]] = defaultdict(set)

          for importer in py_files:
              try:
                  tree = ast.parse(importer.read_text(encoding='utf-8'))
              except Exception:
                  continue
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          imports_by_file[importer].add(alias.name)
                  elif isinstance(node, ast.ImportFrom):
                      if node.module:
                          imports_by_file[importer].add(node.module)

          for importer, modules in imports_by_file.items():
              for name in modules:
                  target = module_paths.get(name)
                  if target:
                      direct[target].add(importer)

          workflow_files = [p for p in tracked if p.as_posix().startswith('.github/workflows/') and p.suffix in {'.yml','.yaml'}]
          workflow_text = {p: p.read_text(encoding='utf-8') for p in workflow_files}

          rows = []
          for path in sorted(candidates, key=lambda p: p.as_posix()):
              importers = sorted(direct.get(path, set()), key=lambda p: p.as_posix())
              prod = [p for p in importers if not (p.name.startswith('test_') or '/tests/' in p.as_posix())]
              tests = [p for p in importers if p not in prod]
              command_refs = []
              for wf, text in workflow_text.items():
                  if path.name in text or path.stem in text:
                      command_refs.append(wf)
              if path.name == 'seed_all.py':
                  hint = 'ACTIVE_CANONICAL_ENTRYPOINT'
              elif prod:
                  hint = 'DIRECT_PRODUCTION_IMPORT'
              elif command_refs:
                  hint = 'WORKFLOW_OR_COMMAND_REFERENCED'
              elif tests:
                  hint = 'DIRECT_TEST_IMPORT_ONLY'
              else:
                  hint = 'NO_DIRECT_IMPORT_OR_WORKFLOW_REFERENCE'
              rows.append((path, prod, tests, command_refs, hint))

          report = Path('docs/maintenance/HIMMA_A02_PYTHON_IMPORT_GRAPH_2026-09-10.md')
          out = [
              '# هِمّة — A02 Python Import Graph',
              '',
              '**AST-based direct imports + workflow command references. No Docker.**',
              '',
              '> عدم وجود direct import لا يعني أن الحذف آمن: قد يكون الملف CLI مستقلًا أو مرجع migration تاريخي. الهدف هو تقليل false positives من البحث النصي.',
              '',
              '| candidate | prod importers | test importers | workflow refs | static class |',
              '|---|---|---|---|---|',
          ]
          for path, prod, tests, wfs, hint in rows:
              fmt = lambda seq: '<br>'.join(f'`{p.as_posix()}`' for p in seq) if seq else '—'
              out.append(f'| `{path.as_posix()}` | {fmt(prod)} | {fmt(tests)} | {fmt(wfs)} | `{hint}` |')

          out += [
              '',
              '## Runtime entrypoints checked',
              '',
              '- `services/api/main.py` is the FastAPI runtime owner.',
              '- `services/api/run_dev.py` is a local-development helper and imports `seed_all` lazily.',
              '- Production release flows must remain migration/canonical-publication driven; legacy seed scripts are not assumed safe merely because they can be run manually.',
              '',
          ]
          report.write_text('\n'.join(out), encoding='utf-8')
          PY

      - name: Commit graph and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-python-import-graph.yml
          git add docs/maintenance/HIMMA_A02_PYTHON_IMPORT_GRAPH_2026-09-10.md
          git commit -m 'docs(audit): trace legacy Python import graph'
          git push origin HEAD:audit/comprehensive-repository-review-2026-09-10
